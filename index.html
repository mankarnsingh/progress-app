<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090909"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Progress"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><title>Progress ⚡</title><style>
:root{color-scheme:dark;--bg:#090909;--panel:#181818;--line:#303030;--orange:#ff8617;--muted:#aaa}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f8f8f8;font:15px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}main{max-width:650px;margin:auto;padding:24px 16px 110px}header{display:flex;align-items:center;gap:12px;margin-bottom:26px}header img{width:48px;border-radius:13px}h1{font-size:25px;margin:0}h2{font-size:21px;margin:12px 0}h3{font-size:17px;margin:0 0 8px}.sub,.muted{color:var(--muted);font-size:13px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0}.session{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}.session strong{font-size:19px}.pill{font-size:12px;color:#ffbc83;background:#41240d;padding:5px 9px;border-radius:100px}button{background:var(--orange);border:0;border-radius:12px;padding:12px 15px;color:#130b05;font-size:14px;font-weight:750;cursor:pointer}button.secondary{background:#292929;color:#eee}button.ghost{background:transparent;color:#ffad65;border:1px solid #6d4221}button:disabled{opacity:.4}input,select{background:#101010;border:1px solid #494949;border-radius:9px;color:white;padding:10px;font-size:16px;min-width:0}input[type=number]{width:100%}input[type=checkbox]{width:23px;height:23px;accent-color:var(--orange)}.set{display:grid;grid-template-columns:36px 1fr 1fr 42px;gap:7px;align-items:center;margin:9px 0}.set-head{font-size:12px;color:#aaa;text-align:center}.set label{text-align:center}.exercise{border-top:1px solid #333;padding-top:15px;margin-top:17px}.exercise:first-of-type{border-top:0}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.bar{position:fixed;bottom:0;left:0;right:0;background:#101010;border-top:1px solid #333;padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:8px;z-index:3}.bar button{flex:1;max-width:200px}.hidden{display:none}.stat{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #333}.stat:last-child{border:0}.notice{background:#302013;border:1px solid #66411f;padding:12px;border-radius:12px;font-size:13px;color:#ffd2a9}a{color:#ffab64}.tiny{font-size:12px;color:#aaa}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#202020;border-radius:12px;padding:12px}.metric b{font-size:22px;color:#ff9a3b}#toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:#363636;padding:10px 16px;border-radius:12px;display:none;z-index:10;white-space:nowrap}details{margin-top:12px}summary{color:#ffac68;cursor:pointer}footer{font-size:12px;color:#888;margin-top:25px}
.ex-heading{display:flex;align-items:center;gap:12px;margin-bottom:10px}.ex-visual{width:88px;height:76px;flex:0 0 88px;border:1px solid #53402c;background:#211b17;border-radius:13px;display:grid;place-items:center}.ex-visual svg{width:82px;height:68px}.ex-heading h3{margin:0 0 5px}.ex-kind{font-size:11px;color:#ffac68}</style></head><body><div id="toast"></div><main><header><img src="icon-192.png" alt="Éclair orange"><div><h1>Progress <span style="color:#ff8617">⚡</span></h1><div class="sub">Chaque répétition compte.</div></div></header><div id="app"></div><footer>Privé · Stockage sur cet appareil · Aucune connexion requise après installation</footer></main><nav class="bar"><button class="secondary" onclick="go('home')">Séances</button><button class="secondary" onclick="go('history')">Historique</button><button class="secondary" onclick="go('settings')">Réglages</button></nav><script>
const templates=[{name:'Push',focus:'Pectoraux · Épaules · Triceps',ex:[['Chest Press Machine',4,8,12],['Développé incliné haltères',3,8,12],['Écarté à la machine',3,12,15],['Shoulder Press Machine',3,8,12],['Élévations latérales',3,12,15],['Extension triceps à la poulie',3,10,15],['Extension triceps au-dessus de la tête à la poulie',2,12,15]]},{name:'Pull',focus:'Dos · Biceps',ex:[['Tirage vertical poitrine',4,8,12],['Rowing assis à la poulie',3,8,12],['Rowing machine',3,10,12],['Reverse Fly Machine',3,12,15],['Curl biceps à la machine',3,10,12],['Curl marteau haltères',3,10,12]]},{name:'Legs',focus:'Jambes · Abdos',ex:[['Presse à cuisses',4,8,12],['Leg Extension',3,10,15],['Leg Curl',3,10,15],['Hip Thrust Machine',3,8,12],['Mollets à la presse',4,12,20],['Crunch à la machine',3,12,20]]},{name:'Upper',focus:'Haut du corps complet',ex:[['Chest Press Machine',3,8,12],['Tirage vertical poitrine',3,8,12],['Développé incliné machine',3,10,12],['Rowing assis à la poulie',3,10,12],['Élévations latérales',3,12,15],['Curl biceps à la machine',2,10,15],['Extension triceps à la poulie',2,10,15]]},{name:'Lower',focus:'Jambes · Abdos',ex:[['Presse à cuisses',4,10,12],['Leg Curl',3,10,15],['Leg Extension',3,10,15],['Hip Thrust Machine',3,10,12],['Mollets à la presse',4,12,20],['Crunch à la machine',3,12,20]]}];
const DEFAULT_TEMPLATES=JSON.parse(JSON.stringify(templates));const KEY='progress_v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))}catch{}if(!state||!Array.isArray(state.history))state={history:[],active:null};if(!Array.isArray(state.templates))state.templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));let page='home',editingTemplate=0;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){localStorage.setItem(KEY,JSON.stringify(state))}function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2200)}function go(p){page=p;render();window.scrollTo(0,0)}function last(ex){for(let i=state.history.length-1;i>=0;i--){let found=state.history[i].ex.find(x=>x.name===ex);if(found)return found}return null}function summary(ex){let p=last(ex.name);if(!p)return 'Première séance · Choisis une charge confortable';let valid=p.sets.filter(s=>s.done&&s.kg!==''&&s.reps!=='');if(!valid.length)return 'Aucune série validée précédemment';let weights=valid.map(s=>Number(s.kg));let reps=valid.map(s=>Number(s.reps));let tip=valid.length>=ex.sets.length&&valid.every(s=>Number(s.reps)>=ex.max)?'Plage haute atteinte : envisage une petite hausse de charge, si la technique et le RIR sont bons.':'Essaie d’ajouter une répétition à charge constante, avec une bonne technique.';return `Dernière fois : ${valid.map(s=>esc(s.kg)+' kg × '+esc(s.reps)).join(' · ')}<br><span style="color:#ffac68">${tip}</span>`}
function start(i){if(state.active&&!confirm('Une séance est en cours. La remplacer ?'))return;let t=state.templates[i];state.active={name:t.name,date:new Date().toISOString(),ex:t.ex.map(([name,n,min,max])=>{let prev=last(name);return{name,min,max,sets:Array.from({length:n},(_,j)=>({kg:prev?.sets[j]?.kg??'',reps:prev?.sets[j]?.reps??'',done:false}))}})};save();go('workout')}
function editSet(e,s,field,val){state.active.ex[e].sets[s][field]=val;save()}function addSet(e){let x=state.active.ex[e],p=x.sets.at(-1);x.sets.push({kg:p?.kg??'',reps:'',done:false});save();render()}function removeSet(e){let x=state.active.ex[e];if(x.sets.length>1){x.sets.pop();save();render()}}function finish(){let count=state.active.ex.flatMap(x=>x.sets).filter(s=>s.done).length;if(!count&&!confirm('Aucune série cochée. Terminer quand même ?'))return;state.history.push({...state.active,finished:new Date().toISOString()});state.active=null;save();toast('Séance enregistrée !');go('history')}function cancel(){if(confirm('Abandonner la séance en cours ?')){state.active=null;save();go('home')}}


function editTemplate(i){editingTemplate=i;go('programs')}
function templateAdd(){const name=prompt("Nom du nouvel exercice :");if(!name||!name.trim())return;const n=Math.max(1,Math.min(12,Number(prompt("Nombre de séries (1 à 12) :","3"))||3));const min=Math.max(1,Number(prompt("Répétitions minimum :","8"))||8);const max=Math.max(min,Number(prompt("Répétitions maximum :","12"))||12);state.templates[editingTemplate].ex.push([name.trim(),n,min,max]);save();render();toast("Exercice ajouté")}
function templateEdit(i){const x=state.templates[editingTemplate].ex[i];const name=prompt("Nom de l'exercice :",x[0]);if(name===null||!name.trim())return;const sets=prompt("Nombre de séries :",x[1]);if(sets===null)return;const min=prompt("Répétitions minimum :",x[2]);if(min===null)return;const max=prompt("Répétitions maximum :",x[3]);if(max===null)return;const n=Number(sets),lo=Number(min),hi=Number(max);if(!Number.isInteger(n)||n<1||n>12||!Number.isInteger(lo)||lo<1||!Number.isInteger(hi)||hi<lo){alert("Valeurs invalides");return}state.templates[editingTemplate].ex[i]=[name.trim(),n,lo,hi];save();render();toast("Exercice modifié")}
function templateRemove(i){const x=state.templates[editingTemplate].ex[i];if(!confirm("Supprimer "+x[0]+" de ce programme ? L'historique reste conservé."))return;state.templates[editingTemplate].ex.splice(i,1);save();render()}
function templateMove(i,dir){const arr=state.templates[editingTemplate].ex,j=i+dir;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];save();render()}
function activeAdd(){const name=prompt("Nom de l'exercice à ajouter à cette séance :");if(!name||!name.trim())return;const n=Math.max(1,Math.min(12,Number(prompt("Nombre de séries :","3"))||3));const min=Math.max(1,Number(prompt("Répétitions minimum :","8"))||8);const max=Math.max(min,Number(prompt("Répétitions maximum :","12"))||12);const prev=last(name.trim());state.active.ex.push({name:name.trim(),min,max,sets:Array.from({length:n},(_,j)=>({kg:prev?.sets[j]?.kg??'',reps:prev?.sets[j]?.reps??'',done:false}))});save();render();toast("Exercice ajouté à la séance")}
function activeRemove(i){if(!confirm("Retirer "+state.active.ex[i].name+" de la séance en cours ?"))return;state.active.ex.splice(i,1);save();render()}
function activeRename(i){const x=state.active.ex[i],name=prompt("Nom de l'exercice :",x.name);if(name===null||!name.trim())return;x.name=name.trim();save();render()}
function exerciseVisual(name){
let n=name.toLowerCase(),type='machine',kind='Machine';
if(n.includes('haltère')||n.includes('marteau')||n.includes('élévations')){type='dumbbell';kind='Haltères'}
else if(n.includes('poulie')||n.includes('tirage vertical')||n.includes('rowing assis')){type='cable';kind='Poulie'}
else if(n.includes('presse à cuisses')||n.includes('mollets à la presse'))type='legpress';
else if(n.includes('leg extension'))type='legext';
else if(n.includes('leg curl'))type='legcurl';
else if(n.includes('hip thrust'))type='hip';
else if(n.includes('shoulder press'))type='shoulder';
else if(n.includes('chest press')||n.includes('développé incliné machine'))type='chest';
else if(n.includes('reverse fly')||n.includes('écarté'))type='fly';
else if(n.includes('rowing machine'))type='row';
else if(n.includes('crunch'))type='crunch';
let base='<path d="M10 63 H90 M18 63 V15 H26 V63 M74 63 V15 H82 V63"/>';
let seat='<path d="M38 49 H59 M46 49 V61 M37 31 V49"/>';
let weight='<rect x="17" y="36" width="10" height="19" rx="2" fill="#ff8617" fill-opacity=".28"/><path d="M17 41 H27 M17 48 H27"/>';
let art={
dumbbell:'<path d="M18 30 H82 M18 22 V38 M25 19 V41 M75 19 V41 M82 22 V38 M37 48 Q50 35 63 48 M43 55 H57"/>',
cable:base+weight+'<circle cx="50" cy="15" r="5"/><path d="M26 15 H50 L61 30 M40 30 H64 M45 49 V62"/>',
legpress:'<path d="M15 62 L45 18 L70 18 L87 62 M15 62 H87 M27 52 L42 36 M39 46 L60 23 M59 21 L73 37 M65 38 L82 24"/><rect x="61" y="16" width="22" height="6" rx="2"/>',
legext:base+seat+weight+'<path d="M58 48 H70 V57 H84 M70 57 V62"/>',
legcurl:base+seat+weight+'<path d="M38 44 H69 L77 53 H87 M76 52 V60"/>',
hip:'<path d="M10 63 H90 M15 48 H42 V56 H15 Z M39 49 H68 L77 58 M56 34 L64 49 M22 24 V47 M72 35 V62"/><circle cx="59" cy="31" r="6"/>',
shoulder:base+seat+weight+'<path d="M31 18 H69 M34 18 V26 L42 31 M66 18 V26 L58 31 M46 30 V46 M40 35 H52"/>',
chest:base+seat+weight+'<path d="M33 29 H67 M33 29 L44 37 M67 29 L56 37 M46 38 V48 M38 38 H59"/>',
fly:base+seat+weight+'<path d="M26 22 L40 37 M74 22 L60 37 M26 22 V36 M74 22 V36 M44 36 H56"/>',
row:base+seat+weight+'<path d="M29 28 H70 M70 28 L59 39 M59 39 H42 M48 39 V48"/>',
crunch:base+seat+weight+'<path d="M35 25 Q50 13 65 25 L59 35 M41 36 Q50 45 59 36"/>',
machine:base+seat+weight+'<path d="M30 25 H70 M30 25 L40 38 M70 25 L60 38"/>'
}[type];
return '<div class="ex-visual" role="img" aria-label="Schéma du matériel : '+esc(name)+'"><svg viewBox="0 0 100 75" aria-hidden="true" fill="none" stroke="#ffa24c" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round">'+art+'</svg></div>';
}
function render(){let out='';if(page==='home'){out='<h2>Choisis ta séance</h2><p class="muted">3, 4 ou 5 entraînements : tu décides, sans calendrier imposé.</p>';if(state.active)out+=`<div class="card"><h3>Séance en cours : ${esc(state.active.name)}</h3><button onclick="go('workout')">Reprendre →</button></div>`;out+=state.templates.map((t,i)=>`<div class="card session" onclick="start(${i})"><div><strong>${esc(t.name)}</strong><p class="muted">${esc(t.focus)}</p><span class="pill">${t.ex.length} exercices</span></div><span style="font-size:25px;color:#ff8617">›</span></div>`).join('');out+='<div class="actions"><button class="secondary" onclick="editTemplate(0)">Modifier mes programmes</button></div>';out+='<div class="notice">Progression : atteins progressivement le haut de la plage de répétitions sur toutes les séries, puis augmente légèrement la charge si ton exécution reste propre et que ton effort le permet.</div>'}
if(page==='programs'){let t=state.templates[editingTemplate];out='<h2>Modifier mes programmes</h2><p class="muted">Les changements sont enregistrés sur cet appareil et s’appliquent aux prochaines séances. Ton historique reste intact.</p><div class="actions">'+state.templates.map((x,i)=>'<button class="'+(i===editingTemplate?'':'secondary')+'" onclick="editTemplate('+i+')">'+esc(x.name)+'</button>').join('')+'</div><h3 style="margin-top:20px">'+esc(t.name)+'</h3>';out+=t.ex.map((x,i)=>'<div class="card"><div class="ex-heading">'+exerciseVisual(x[0])+'<div><h3>'+esc(x[0])+'</h3><div class="muted">'+x[1]+' séries · '+x[2]+'–'+x[3]+' répétitions</div></div></div><div class="actions"><button class="secondary" onclick="templateEdit('+i+')">Modifier</button><button class="ghost" onclick="templateRemove('+i+')">Supprimer</button><button class="secondary" onclick="templateMove('+i+',-1)">↑</button><button class="secondary" onclick="templateMove('+i+',1)">↓</button></div></div>').join('');out+='<div class="actions"><button onclick="templateAdd()">+ Ajouter un exercice</button><button class="secondary" onclick="go(\'home\')">Retour</button></div>'}
if(page==='workout'){if(!state.active){go('home');return}let a=state.active;out=`<h2>${esc(a.name)}</h2><p class="muted">Coche chaque série terminée. Les valeurs sont sauvegardées automatiquement.</p>`;out+=a.ex.map((x,i)=>`<section class="card"><div class="ex-heading">${exerciseVisual(x.name)}<div><h3>${i+1}. ${esc(x.name)}</h3><div class="muted">${x.sets.length} séries · ${x.min}–${x.max} répétitions</div><div class="ex-kind">Illustration du matériel</div></div></div><div class="actions"><button class="secondary" onclick="activeRename(${i})">Renommer</button><button class="ghost" onclick="activeRemove(${i})">Supprimer l'exercice</button></div><p class="tiny">${summary(x)}</p><div class="set set-head"><span>N°</span><span>Kg</span><span>Reps</span><span>✓</span></div>${x.sets.map((s,j)=>`<div class="set"><label>${j+1}</label><input aria-label="Poids série ${j+1}" type="number" min="0" step="0.5" inputmode="decimal" value="${esc(s.kg)}" onchange="editSet(${i},${j},'kg',this.value)"><input aria-label="Répétitions série ${j+1}" type="number" min="0" step="1" inputmode="numeric" value="${esc(s.reps)}" onchange="editSet(${i},${j},'reps',this.value)"><label><input type="checkbox" ${s.done?'checked':''} onchange="editSet(${i},${j},'done',this.checked)"></label></div>`).join('')}<div class="actions"><button class="secondary" onclick="addSet(${i})">+ Série</button><button class="secondary" onclick="removeSet(${i})">− Série</button></div></section>`).join('');out+='<div class="actions"><button class="secondary" onclick="activeAdd()">+ Ajouter un exercice à cette séance</button></div>';out+='<div class="actions"><button onclick="finish()">Terminer et enregistrer</button><button class="ghost" onclick="cancel()">Abandonner</button></div>'}
if(page==='history'){out='<h2>Historique</h2>';if(!state.history.length)out+='<div class="card muted">Aucune séance enregistrée pour le moment.</div>';else{let total=state.history.length,sets=state.history.reduce((a,s)=>a+s.ex.flatMap(x=>x.sets).filter(x=>x.done).length,0);out+=`<div class="grid2"><div class="metric"><b>${total}</b><div class="muted">Séances</div></div><div class="metric"><b>${sets}</b><div class="muted">Séries validées</div></div></div>`;out+=state.history.slice().reverse().map((s,i)=>`<div class="card"><h3>${esc(s.name)} <span class="tiny">${new Date(s.date).toLocaleDateString('fr-FR')}</span></h3><details><summary>Voir les performances</summary>${s.ex.map(x=>`<div class="stat"><div>${esc(x.name)}<div class="tiny">${x.sets.filter(z=>z.done).map(z=>esc(z.kg)+' kg × '+esc(z.reps)).join(' · ')||'Aucune série validée'}</div></div></div>`).join('')}</details></div>`).join('')}}
if(page==='settings'){out=`<h2>Mes données</h2><div class="notice">Tout reste sur cet appareil. Pense à conserver une sauvegarde dans Fichiers, en dehors de l'application. Supprimer les données Safari peut effacer l'historique local.</div><div class="card"><h3>Sauvegarder</h3><p class="muted">Le JSON conserve tes séances et permet de restaurer l'application. Le CSV est lisible dans Excel.</p><div class="actions"><button onclick="exportJSON()">Exporter JSON</button><button class="secondary" onclick="exportCSV()">Exporter CSV</button></div></div><div class="card"><h3>Restaurer une sauvegarde</h3><p class="muted">Importe un fichier JSON exporté depuis Progress. L'import remplace les données présentes.</p><input type="file" id="restore" accept="application/json,.json" onchange="importJSON(this.files[0])"></div><div class="card"><h3>Effacer toutes les données</h3><button class="ghost" onclick="erase()">Effacer définitivement</button></div><div class="card"><h3>Installer sur iPhone</h3><p class="muted">Ouvre l'adresse de l'application dans Safari, puis Partager → Sur l'écran d'accueil → Ajouter.</p></div>`}$('#app').innerHTML=out}
function download(name,content,type){let blob=new Blob([content],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}function exportJSON(){download('progress-sauvegarde-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'Progress',version:1,data:state},null,2),'application/json')}function csv(v){return '"'+String(v??'').replace(/"/g,'""')+'"'}function exportCSV(){let rows=[['Date','Séance','Exercice','Série','Poids (kg)','Répétitions','Validée']];for(let s of state.history)for(let x of s.ex)x.sets.forEach((z,i)=>rows.push([s.date,s.name,x.name,i+1,z.kg,z.reps,z.done?'Oui':'Non']));download('progress-historique.csv','\ufeff'+rows.map(r=>r.map(csv).join(';')).join('\r\n'),'text/csv;charset=utf-8')}async function importJSON(file){if(!file)return;try{let obj=JSON.parse(await file.text()),d=obj.data;if(obj.app!=='Progress'||obj.version!==1||!d||!Array.isArray(d.history)||!(d.active===null||typeof d.active==='object'))throw Error('Format invalide');if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;state=d;if(!Array.isArray(state.templates))state.templates=JSON.parse(JSON.stringify(DEFAULT_TEMPLATES));save();toast('Sauvegarde restaurée');go('home')}catch(e){alert('Import impossible : '+e.message)}}function erase(){if(confirm('Effacer définitivement tout ton historique et ta séance en cours ?')){state={history:[],active:null,templates:JSON.parse(JSON.stringify(DEFAULT_TEMPLATES))};save();go('home')}}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
